<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Kho Addon Minecraft - Hệ Thống Tự Động</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(18, 22, 34, 0.75);
      --bg-card-hover: rgba(28, 35, 54, 0.9);
      --border-color: rgba(255, 255, 255, 0.08);
      --primary: #00f2fe;
      --primary-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --btn-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #7000ff 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --success: #10b981;
      --shadow-neon: 0 0 25px rgba(0, 242, 254, 0.35);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding: 30px 18px;
    }
    .cyber-grid {
      position: fixed; inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px; z-index: 0; pointer-events: none;
    }
    .app-wrapper { position: relative; z-index: 2; max-width: 900px; margin: 0 auto; }
    .header {
      background: var(--bg-card); backdrop-filter: blur(20px);
      border: 1px solid var(--border-color); padding: 18px 24px;
      border-radius: var(--radius-lg); margin-bottom: 24px; text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .header h1 {
      font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900;
      background: linear-gradient(90deg, #fff 0%, #00f2fe 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }
    .header p { font-size: 13px; color: var(--text-sub); margin-top: 6px; }
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .game-item {
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 18px; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-decoration: none; display: flex; flex-direction: column;
    }
    .game-item:hover {
      background: var(--bg-card-hover); border-color: rgba(0, 242, 254, 0.5);
      transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
    }
    .game-name { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .game-desc { font-size: 12px; color: var(--text-sub); margin-bottom: 16px; line-height: 1.4; flex-grow: 1; }
    .btn-select {
      background: var(--btn-gradient); color: #fff; border: none; border-radius: var(--radius-sm);
      padding: 10px; font-size: 13px; font-weight: 800; text-transform: uppercase; text-align: center;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }
  </style>
</head>
<body>
  <div class="cyber-grid"></div>
  <div class="app-wrapper">
    <header class="header">
      <h1>KHO ADDON MINECRAFT VIP</h1>
      <p>Hệ thống tự động cấp key tải addon tốc độ cao 24/7</p>
    </header>

    <div class="game-grid">
      <!-- Addon 1 -->
      <a href="addon.html?id=furniture&name=Furniture+Addon" class="game-item">
        <div class="game-name">Furniture Addon v1.0</div>
        <div class="game-desc">Trang trí nội thất cực đẹp, nhiều mẫu mã hiện đại cho thế giới của bạn.</div>
        <div class="btn-select">Chọn Tải Ngay</div>
      </a>
      <!-- Addon 2 -->
      <a href="addon.html?id=naruto&name=Naruto+Shinden" class="game-item">
        <div class="game-name">Naruto Shinden Addon</div>
        <div class="game-desc">Hóa thân thành nhẫn giả, sử dụng nhẫn thuật và huyết kế hạn giới.</div>
        <div class="btn-select">Chọn Tải Ngay</div>
      </a>
    </div>
  </div>
</body>
</html>
